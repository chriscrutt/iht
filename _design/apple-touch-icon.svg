<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Source of apple-touch-icon.png (180x180): the favicon, full-bleed (iOS rounds the corners)
       and with the letters at 80% so they stay clear of the rounding. -->
