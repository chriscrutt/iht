  <g fill="#fff" transform="translate(6.4 6.4) scale(0.8)">
    <rect x="6" y="18" width="6" height="28"/>
    <rect x="16" y="18" width="6" height="28"/>
    <rect x="30" y="18" width="6" height="28"/>
    <rect x="22" y="28" width="8" height="6"/>
    <rect x="40" y="18" width="18" height="6"/>
    <rect x="46" y="24" width="6" height="22"/>
  </g>
</svg>
