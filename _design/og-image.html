<!doctype html>
<html lang="en">
<!-- Source of image/og-image.png, the link-preview picture for home, team and the dashboard.
     Render it at exactly 1200x630 (see .claude/CLAUDE.md, "Icons and link previews"). -->
<head>
  <meta charset="utf-8">
  <title>iht.tools link preview</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700..800&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
  <style>
    html, body { margin: 0; }
    .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #466eb6; color: #fff;
            font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif; }
    .mark { position: absolute; left: 72px; top: 58px; font-family: "Archivo", sans-serif; font-weight: 800;
            font-size: 42px; letter-spacing: 0.02em; }
    .text { position: absolute; left: 72px; top: 150px; width: 520px; }
    h1 { margin: 0 0 28px; font-family: "Archivo", sans-serif; font-weight: 800; font-size: 96px; line-height: 0.98;
         letter-spacing: -0.015em; }
    p { margin: 0; font-size: 32px; line-height: 1.35; }
    .url { position: absolute; left: 72px; bottom: 54px; font-weight: 700; font-size: 28px; }
    .art { position: absolute; right: 24px; bottom: 0; width: 560px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">IHT</div>
    <div class="text">
      <h1>Pro-Active Wellness</h1>
      <p>Cash rewards that motivate older patients to make healthy choices.</p>
    </div>
    <div class="url">iht.tools</div>
    <img class="art" src="../image/illustrations/walk-in-the-park.svg" alt="">
  </div>
</body>
</html>
