<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | IHT</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#466eb6">
  <meta name="description" content="A clinic dashboard that shows patients' check-in results and how many need follow-up.">
  <!-- Link previews (texts, chats, social posts): the picture and words a shared link shows.
       These URLs must be absolute, so they name iht.tools. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IHT">
  <meta property="og:title" content="Dashboard | IHT">
  <meta property="og:description" content="A clinic dashboard that shows patients' check-in results and how many need follow-up.">
  <meta property="og:url" content="https://iht.tools/dashboard/">
  <meta property="og:image" content="https://iht.tools/image/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="IHT: Pro-Active Wellness. Cash rewards that motivate older patients to make healthy choices.">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The two font files every page needs, asked for straight away (the theme names them too). -->
  <link rel="preload" href="../fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/atkinson-hyperlegible-next-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- The shared theme. It loads its own fonts. -->
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="iht">
  <a class="iht-skip" href="#main">Skip to content</a>
  <header class="iht-header iht-header--sticky">
    <div class="iht-header__inner">
      <a class="iht-brand" href="../">
        <h1 class="iht-wordmark">IHT</h1>
      </a>
      <div class="menu-block-wrapper">
        <div class="menu-overlay"></div>
        <nav class="menu-block" id="append-menu-header">
          <div class="mobile-menu-head">
            <div class="mobile-menu-close">&times;</div>
          </div>
          <ul class="site-menu-main">
            <li class="nav-item">
              <a href="../team/" class="nav-link-item">Our Team</a>
            </li>
            <li class="nav-item iht-nav-item--cta">
              <a href="../#request-a-demo" class="nav-link-item iht-nav-cta">Request a Demo</a>
            </li>
          </ul>
        </nav>
      </div>
      <div class="mobile-menu-trigger">
        <span></span>
      </div>
    </div>
  </header>

  <!-- The programs down the left, one view on the right. script.js fills the sidebar, the phone's
       picker and the views from its sample data. -->
  <div class="dash-shell">
    <nav class="dash-nav" aria-label="Programs" id="dash-nav"></nav>
    <main id="main" tabindex="-1" class="dash">
      <!-- Below 992px the sidebar gives way to this picker. -->
      <div class="dash-pick">
        <label for="dash-program">Program</label>
        <select id="dash-program"></select>
      </div>
      <div class="dash-views" id="dash-views"></div>
      <noscript>
        <p>This dashboard needs JavaScript to show its numbers.</p>
      </noscript>
    </main>
  </div>

  <footer class="iht-footer">
    <div class="iht-wrap iht-footer__inner">
      <span>Incentive Health Technologies, LLC</span>
    </div>
  </footer>

  <script src="script.js"></script>
  <!-- The shared header's phone menu. -->
  <script src="../plugins/menu/menu.js"></script>
</body>

</html>
