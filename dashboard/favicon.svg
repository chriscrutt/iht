<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- iht.tools favicon: the IHT wordmark as solid white bars on IHT blue. Edges sit on even units
       of the 64 grid, so they land on whole pixels at 32px. Source of the PNG and ICO copies. -->
  <rect width="64" height="64" rx="12" fill="#466eb6"/>
  <g fill="#fff">
    <rect x="6" y="18" width="6" height="28"/>
    <rect x="16" y="18" width="6" height="28"/>
    <rect x="30" y="18" width="6" height="28"/>
    <rect x="22" y="28" width="8" height="6"/>
    <rect x="40" y="18" width="18" height="6"/>
    <rect x="46" y="24" width="6" height="22"/>
  </g>
</svg>
