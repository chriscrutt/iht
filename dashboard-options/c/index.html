<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option C: follow-up worklist | Dashboard options | IHT</title>
  <!-- A temporary preview: one of three layout options for the dashboard. Search engines stay out. -->
  <meta name="robots" content="noindex">
  <link rel="icon" href="../../dashboard/favicon.ico" sizes="32x32">
  <link rel="icon" href="../../dashboard/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../dashboard/apple-touch-icon.png">
  <meta name="theme-color" content="#466eb6">
  <!-- The shared theme. It loads its own fonts. -->
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="c.css">
</head>

<body class="iht dash-c">
  <a class="iht-skip" href="#main">Skip to content</a>
  <!-- Switches between the three options. It goes when one is chosen. -->
  <nav class="opt-strip" aria-label="Layout options">
    <span>Layout options (temporary):</span>
    <a href="../a/">A: Sidebar app</a>
    <a href="../b/">B: One scrolling page</a>
    <a href="../c/" aria-current="page">C: Follow-up worklist</a>
  </nav>
  <header class="iht-header iht-header--sticky">
    <div class="iht-header__inner">
      <a class="iht-brand" href="../../">
        <h1 class="iht-wordmark">IHT</h1>
      </a>
      <div class="menu-block-wrapper">
        <div class="menu-overlay"></div>
        <nav class="menu-block" id="append-menu-header">
          <div class="mobile-menu-head">
            <div class="mobile-menu-close">&times;</div>
          </div>
          <ul class="site-menu-main">
            <li class="nav-item">
              <a href="../../team/" class="nav-link-item">Our Team</a>
            </li>
            <li class="nav-item iht-nav-item--cta">
              <a href="../../#request-a-demo" class="nav-link-item iht-nav-cta">Request a Demo</a>
            </li>
          </ul>
        </nav>
      </div>
      <div class="mobile-menu-trigger">
        <span></span>
      </div>
    </div>
  </header>

  <!-- Option C, the follow-up worklist: the people who need follow-up come first, across every
       program; how each program is doing comes after. c.js fills the tiles, the list and the
       programs. -->
  <main id="main" tabindex="-1" class="dash">
    <section class="iht-wrap dash-work" aria-labelledby="work-title">
      <div class="dash-title">
        <h1 class="dash-h1" id="work-title">Who needs follow-up</h1>
        <span class="dash-sample">Sample data</span>
      </div>
      <!-- Pressing a tile shows only that program's patients. -->
      <div class="dash-tiles" id="dash-tiles" role="group" aria-label="Show patients from"></div>
      <div class="dash-list">
        <div class="dash-list__tools">
          <p class="dash-shown" id="dash-shown" role="status"></p>
          <button type="button" class="iht-btn dash-quiet" id="dash-download">Download</button>
        </div>
        <div class="dash-table-wrap" role="region" tabindex="0" aria-label="Follow-up list">
          <table class="dash-table">
            <thead>
              <tr>
                <th scope="col">Name</th>
                <th scope="col">Program</th>
                <th scope="col">Why</th>
                <th scope="col">Patient ID</th>
                <th scope="col">Age</th>
              </tr>
            </thead>
            <tbody id="dash-work"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="iht-band iht-band--mist" aria-labelledby="doing-title">
      <div class="iht-wrap dash-doing">
        <h2 class="iht-h2" id="doing-title">How each program is doing</h2>
        <div id="dash-programs"></div>
        <p class="dash-note" id="dash-more"></p>
      </div>
    </section>
    <noscript>
      <p class="iht-wrap">This dashboard needs JavaScript to show its numbers.</p>
    </noscript>
  </main>

  <footer class="iht-footer">
    <div class="iht-wrap iht-footer__inner">
      <span>Incentive Health Technologies, LLC</span>
    </div>
  </footer>

  <script src="../shared.js"></script>
  <script src="c.js"></script>
  <!-- The shared header's phone menu. -->
  <script src="../../plugins/menu/menu.js"></script>
</body>

</html>
