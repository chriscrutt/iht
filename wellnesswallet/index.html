<body data-theme-mode-panel-active data-theme="light" style="font-family: 'Mazzard H';">
  <div class="site-wrapper overflow-hidden position-relative">
    <!-- Site Header -->
    <!-- Preloader -->
    <!-- <div id="loading">
    <div class="preloader">
     <img src="./image/preloader.gif" alt="preloader">
   </div>
   </div>    -->
    <!--Site Header Area -->
    <header style="background-color: #466EB6;"
      class="site-header site-header--menu-right landing-14-menu site-header--absolute site-header--sticky">
      <div class="container">
        <nav style=" height: 92px;" class="navbar site-navbar">
          <!-- Brand Logo-->
          <div class="brand-logo">
            <a href="#">
              <!-- <img src="image/logo/logo-black.png" alt=""> -->
              <h1 style="font-family: Rubik; color: #ffffff;" class="nav-link-item">Improve Your Health … Earn Cash …
                Live Better</h1>
            </a>
          </div>
        </nav>
      </div>
    </header>
    <!-- navbar- -->
    <!-- Hero Area -->
    <div class="hero-area-l-14 position-relative z-index-1 overflow-hidden" style="height: 100vh;">
      <div class="container">
        <div class="row position-relative justify-content-center">
          <div class="col-xl-5 col-lg-6 col-md-8 col-sm-10 pr-0 " data-aos="fade-right" data-aos-duration="800"
            data-aos-once="true" style="width: 50%;">
            <div class="content">
              <h1 id="greeting" style="color:#466EB6; font-size: 10vh;line-height: 10vh;">Hello Christopher!</h1>
              <p style="color:#466EB6; font-size: 5vh; line-height: 5vh;">Answer a few questions then watch a quick

              <!-- <div onclick="console.log('yo')"> -->
              <a href="./fallPrevention/" id="getStarted" class="btn focus-reset"
                style="font-size: 5vh;border-radius:1vh;">Get
                Started</a> <!-- </div> -->
            </div>
          </div>
          <div class="col-xl-7 col-lg-5 col-md-8 " data-aos="fade-left" data-aos-duration="800" data-aos-once="true"
            style="width: 50%;">
            <div class="banner-image-l-14" style="position:absolute; margin-top:0">
              <img src="./image/giftCard.svg"
                alt="https://www.freepik.com/free-vector/gift-card-peoples-hands-flat-vector-illustration-person-giving-birthday-present-celebration-party-surprise-congratulation-holiday-concept-banner-website-design-landing-web-page_26921767.htm Image by pch.vector on Freepik"
                class="w-100 mt-xl-n10">
            </div>
          </div>
        </div>
      </div>
      <div class="bg-shape-14"></div>
    </div>
  </div>
  <style>
    .hero-area-l-14 .content .btn {
      border: 3px solid seagreen !important;
      background-color: seagreen;
      color: #fff;
      height: 7vh;
    }

    .hero-area-l-14 .content .btn:hover {
      border: 3px solid seagreen !important;
      background-color: mediumseagreen !important;
      /* color: limegreen !important; */
    }

    /* Phones, portrait tablets and zoomed-in laptops. The two-column hero above is one window
       tall, can't scroll and sizes its type in vh, so on narrow or portrait screens its text runs
       off the bottom. Here the text goes above the picture, the type is sized mostly by the
       width, and the header, hero and footer follow one another so the page can scroll.
       !important is needed to beat the inline styles and main.css's own !important rules. */
    @media (max-width: 991.98px), (orientation: portrait) {
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100svh;
      }

      .site-wrapper {
        flex: 1 0 auto;
      }

      header.site-header.site-header--sticky {
        position: relative !important;
        transform: none !important;
      }

      .site-header .site-navbar {
        height: auto !important;
        min-height: 92px;
      }

      .hero-area-l-14 {
        height: auto !important;
        padding-top: 2rem;
        padding-bottom: 2.5rem;
      }

      .hero-area-l-14 .content {
        padding-top: 0;
      }

      .hero-area-l-14 .row > div {
        width: 100% !important;
      }

      /* "Christopher!" can't wrap, so the width caps the size even when the browser's default
         font size is larger than usual. */
      #greeting {
        font-size: min(clamp(2.5rem, 12vw, 10vh), 13vw) !important;
        line-height: 1.1 !important;
        letter-spacing: -.04em;
      }

      .hero-area-l-14 .content p {
        font-size: clamp(1.375rem, 6.5vw, 5vh) !important;
        line-height: 1.25 !important;
      }

      .hero-area-l-14 .content .btn {
        font-size: clamp(1.5rem, 7vw, 5vh) !important;
        line-height: 1.2;
        height: auto;
        padding: .35em .8em;
        border-radius: .2em !important;
      }

      .banner-image-l-14 {
        position: static !important;
        max-width: 34rem;
        margin: 0 auto;
        padding-top: 2.5rem;
      }

      footer {
        position: static !important;
        transform: none !important;
      }
    }
  </style>
  <!-- Footer Area -->
  <!-- Vendor Scripts -->
  <script src="./js/vendor.min.js"></script>
  <script src="./plugins/aos/aos.min.js"></script>
  <!-- Activation Script -->
  <script src="./js/custom.js"></script>
</body>
