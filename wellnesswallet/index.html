<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Wellness Wallet | IHT</title>
  <link rel="shortcut icon" href="./image/favicon.png" type="image/x-icon">
  <!-- Bootstrap , fonts & icons  -->
  <link rel="stylesheet" href="./css/bootstrap.css">
  <!-- Vendor stylesheets  -->
  <link rel="stylesheet" href="./css/main.css">
  <!-- The shared theme, after the template CSS so it wins. It loads its own fonts. -->
  <link rel="stylesheet" href="../css/theme.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BTYQ6V2CCM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-BTYQ6V2CCM');
  </script>
</head>

<body class="iht iht--patient" data-theme-mode-panel-active data-theme="light">
  <!-- The shared header, patient version: the wordmark and "Wellness Wallet", no links. -->
  <header class="iht-header iht-header--patient">
    <div class="iht-header__inner">
      <h1 class="iht-brand"><span class="iht-wordmark">IHT</span> <span class="iht-brand__app">Wellness Wallet</span></h1>
    </div>
  </header>
  <main class="ww-start">
    <div class="ww-start__grid">
      <!-- The slogan was the old header's text. It breaks between its phrases (see the styles). -->
      <p class="ww-slogan"><span>Improve Your Health …</span> <span>Earn Cash …</span> <span>Live Better</span></p>
      <div class="ww-start__text">
        <h1 id="greeting">Hello Christopher!</h1>
        <p class="ww-lede">Answer a few questions then watch a quick video and get a <strong>$10 gift card</strong> sent to
          your home.</p>
        <a href="./fallPrevention/" id="getStarted" class="iht-btn iht-btn--primary iht-btn--pill">Get Started</a>
      </div>
      <figure class="ww-start__art">
        <img src="./image/gift-card.svg" alt="A woman beside a large gift card" width="748" height="407">
      </figure>
    </div>
  </main>
  <footer class="iht-footer iht-footer--slim">
    <span>Incentive Health Technologies, LLC</span>
  </footer>
  <style>
    /* The look (type, colours, the header, the button) is in ../css/theme.css. This is the page's
       layout.

       Landscape windows from 992px: one window, the slogan across the top, then the greeting and
       its text beside the picture. The type is sized in vh, as before, so it follows the window's
       height; nothing is smaller than it was. The header is fixed over the top of the page
       (theme.css), so the page starts below it. If a larger default font makes the content taller
       than the window, the page grows and scrolls instead of cutting it off. */
    body.iht--patient {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
    }

    .ww-start {
      flex: 1 0 auto;
      display: flex;
      align-items: center;
      padding: calc(var(--iht-header-h) + 4vh) 0 5vh;
    }

    .ww-start__grid {
      display: grid;
      /* The text's column is never narrower than "Christopher!", which can't wrap; the picture
         takes what's left. */
      grid-template-columns: minmax(min-content, 1fr) minmax(0, 1fr);
      grid-template-areas:
        "slogan slogan"
        "text art";
      column-gap: 3rem;
      align-items: center;
      width: 100%;
      max-width: var(--iht-max);
      margin: 0 auto;
      padding: 0 var(--iht-gutter);
    }

    /* The old header's line, now on the page, as large as it was in the bar (Bootstrap's h1:
       1.375rem + 1.5vw, and 2.5rem from 1200px), on one line (it's 22.3em wide). With a larger
       default font the old one wrapped and ran off the top of the window; this one is capped
       instead, at the largest size that still fits on one line. */
    .ww-slogan {
      --ww-one-line: calc((min(100vw, var(--iht-max)) - 2 * var(--iht-gutter)) / 22.8);
      grid-area: slogan;
      margin: 0 0 3vh;
      color: var(--iht-ink);
      font-family: var(--iht-display);
      font-weight: 700;
      font-size: min(1.375rem + 1.5vw, var(--ww-one-line));
      line-height: 1.15;
      letter-spacing: -0.005em;
      text-wrap: balance;
    }

    @media (min-width: 1200px) {
      .ww-slogan {
        font-size: min(2.5rem, var(--ww-one-line));
      }
    }

    .ww-slogan span {
      white-space: nowrap;
    }

    .ww-start__text {
      grid-area: text;
    }

    #greeting {
      margin: 0;
      color: var(--iht-ink);
      font-family: var(--iht-display);
      font-weight: 800;
      font-size: 10vh;
      line-height: 1.05;
      letter-spacing: -0.015em;
    }

    .ww-lede {
      margin: 0.5em 0 0.8em;
      color: var(--iht-ink);
      font-size: 5vh;
      line-height: 1.3;
    }

    /* The reward is the one thing in green. It moves to the next line as a whole rather than
       breaking, unless it's wider than a whole line (a 280px window with a 32px default font);
       then it wraps inside its own box instead of running off the side. */
    .ww-lede strong {
      display: inline-block;
      color: var(--iht-reward);
      font-weight: 700;
    }

    /* Go on: the filled blue pill. */
    #getStarted {
      min-height: max(7vh, 48px);
      padding: 0.3em 1.15em;
      font-size: 5vh;
      line-height: 1.15;
      text-align: center;
    }

    /* On wide windows the greeting's 10vh makes the text's column wide, so the picture may run
       into the right-hand margin, stopping 4.5rem (the 2.5rem gutter plus 2rem) short of the
       window's edge. */
    .ww-start__art {
      grid-area: art;
      margin: 0 calc(-1 * max(0px, (100vw - var(--iht-max)) / 2 - 2rem)) 0 0;
    }

    .ww-start__art img {
      display: block;
      width: 100%;
      max-height: 62vh;
      object-fit: contain;
    }

    /* Phones, portrait tablets and zoomed-in laptops (PR #3's layout). The slogan, the text and
       the picture follow one another, the type is sized mostly by the width, and the header, page
       and footer come one after another so the page scrolls. The theme lays the header over the
       page (absolute, or fixed from 992px), so here it goes back into the flow. */
    @media (max-width: 991.98px), (orientation: portrait) {
      .iht-header--patient {
        position: relative;
      }

      .ww-start {
        display: block;
        padding: min(2rem, 32px) 0 2.5rem;
      }

      .ww-start__grid {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "slogan"
          "text"
          "art";
      }

      /* Master's size, as many lines as it needs, broken between its phrases. The longest,
         "Improve Your Health …", is 10.7em wide; the cap is only a safety net, since below
         21em (the last rule) the phrases may break instead. */
      .ww-slogan {
        margin-bottom: 0.5em;
        font-size: min(1.375rem + 1.5vw, (100vw - 2 * var(--iht-gutter)) / 10.9);
      }

      /* "Christopher!" can't wrap, so the width caps the size even when the browser's default
         font size is larger than usual. It's 6.1em wide, so 13vw always fits. */
      #greeting {
        font-size: min(clamp(2.5rem, 12vw, 10vh), 13vw);
        line-height: 1.1;
      }

      .ww-lede {
        margin: 0.6em 0 0.9em;
        font-size: clamp(1.375rem, 6.5vw, 5vh);
        line-height: 1.25;
      }

      /* The side padding is capped, so a larger default font keeps "Get Started" on one line.
         On phones, theme.css sets its width and label size, shared by the patient pages' main
         buttons. */
      #getStarted {
        min-height: 48px;
        padding: 0.35em min(1.1em, 5vw);
        font-size: clamp(1.5rem, 7vw, 5vh);
        line-height: 1.2;
      }

      .ww-start__art {
        width: 100%;
        max-width: 34rem;
        margin: 0 auto;
        padding-top: 2.5rem;
      }

      .ww-start__art img {
        max-height: none;
      }
    }

    /* A window under 21em (336px at the default font, 672px with a 32px one): at master's size
       the longest phrase wouldn't fit, so the slogan breaks between any words, as the old one
       did, and keeps its size. */
    @media (max-width: 20.99875em) {
      .ww-slogan {
        font-size: calc(1.375rem + 1.5vw);
      }

      .ww-slogan span {
        white-space: normal;
      }
    }
  </style>
  <!-- Vendor Scripts -->
  <script src="./js/vendor.min.js"></script>
  <!-- custom.js calls AOS.init(), so AOS stays, though nothing fades in any more. -->
  <script src="./plugins/aos/aos.min.js"></script>
  <!-- Activation Script -->
  <script src="./js/custom.js"></script>
</body>

</html>
